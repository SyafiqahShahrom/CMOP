# docker-compose.yml
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=cmop
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_USER=cmop
      - MYSQL_PASSWORD=secret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    command: php artisan queue:work --tries=3 --backoff=10,30,60
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  vite:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"

volumes:
  mysql-data:
