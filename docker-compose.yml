# docker-compose.yml
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    command: php artisan queue:work --tries=3 --backoff=10,30,60
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      - redis

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  vite:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
